name: GitHub Galaga Contribution Game

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual triggering of the workflow
  workflow_dispatch:
  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Generate the Galaga contribution graph SVGs
      - name: Generate Galaga Contribution Graph
        uses: SaeedVaziry/pacman-contribution-graph@v1
        with:
          # GitHub username to generate the graph for
          username: ${{ github.repository_owner }}
          # Specify the theme/game mode (galaga or pacman)
          game: galaga
          output_dir: ./dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Deploy the generated files to the 'pacman-output' branch
      - name: Deploy to Pacman Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: pacman-output
          commit_message: "Update Galaga contribution graph [skip ci]"